name: creator_studio_document
description: >-
  Read, create, and edit Keynote presentations in Keynote Interchange Format
  (.keyx). An unofficial Dart port of apple/creator-studio-doc-format.
version: 0.1.0
repository: https://github.com/nikodembernat/creator_studio_document
topics:
  - keynote
  - keyx
  - presentation
  - slides
  - file-format

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.7.1
  collection: ^1.19.1
  logging: ^1.3.0
  meta: ^1.19.0
  path: ^1.9.1

dev_dependencies:
  leancode_lint: ^28.0.0
  test: ^1.25.6
